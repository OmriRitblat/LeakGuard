# LiteLLM Proxy configuration for LeakGuard (LiteLLM 1.108.20, pinned in pyproject.toml).
#
# Start from the project root (LiteLLM reads LITELLM_MASTER_KEY from .env there):
#   litellm --config config/litellm.yaml
#
# Every request must send the master key: Authorization: Bearer <LITELLM_MASTER_KEY>

model_list:
  # Mock model: the LeakGuard mock LLM (MockLLMProvider) answers with the messages it received
  # after the hook, and never calls a real provider, so no provider API key is needed
  # (POC test provider). Recording: mock_llm.record_file in config/leakguard.yaml.
  - model_name: leakguard-mock
    litellm_params:
      model: leakguard-mock/echo      # <provider>/<model>; the provider is registered below

litellm_settings:
  custom_provider_map:
    - provider: leakguard-mock
      custom_handler: leakguard.infrastructure.litellm.mock_llm_provider.mock_llm_provider

guardrails:
  # The LeakGuard pre-call hook, run on every request (FR-01).
  - guardrail_name: leakguard
    litellm_params:
      guardrail: leakguard.infrastructure.litellm.guardrail.LeakGuardGuardrail
      mode: pre_call
      default_on: true

general_settings:
  # Never write the key here (the repository is public); it comes from the environment.
  master_key: os.environ/LITELLM_MASTER_KEY
