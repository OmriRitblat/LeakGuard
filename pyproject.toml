[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "leakguard"
version = "0.1.0"
description = "LeakGuard: semantic DLP guardrail for LiteLLM Proxy (BGU SE final project)"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "sqlalchemy>=2.0",         # BaseRepositoryImpl[T]
    "psycopg[binary]",         # PostgreSQL driver
    "pgvector",                # PgVectorIndex (PC-05)
    "argon2-cffi",             # Argon2PasswordHasher (NFR-06)
    "pyjwt",                   # JwtTokenIssuer
    "cryptography",            # CryptoService, AES-256-GCM (NFR-01)
    "httpx",                   # HttpInspectionClient (Alpha)
    "pydantic-settings[yaml]>=2.4",  # leakguard.config.Settings + config/leakguard.yaml
    "python-dotenv>=1.0",
]

[project.optional-dependencies]
# LiteLLM Proxy + LeakGuardGuardrail (CustomGuardrail base class). Exact pin (PC-01, R4):
# 1.108 is the LTS line; releases 1.82.7, 1.82.8 and 1.107.0 were compromised on PyPI.
litellm = ["litellm[proxy]==1.108.20"]
ml = [                         # heavy: pulls in PyTorch
    "sentence-transformers",   # SentenceTransformerBiEncoder, HfCrossEncoderModel
    "transformers",            # HfLocalLlm
]
all = ["leakguard[litellm,ml]"]
dev = ["pytest"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]

